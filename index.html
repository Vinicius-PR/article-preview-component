<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Article preview component</title>

</head>
<body>

  <article class="article">
    <div class="article-image">
      <img src="./images/drawers.jpg" alt="Drawers image">
    </div>
    <section class="article-content">
      <h1 class="text-preset-1 text-grey-900 ">
        Shift the overall look and feel by adding these wonderful touches to furniture in your home
      </h1>

      <p class="text-preset-2-medium text-grey-500">
        Ever been in a room and felt like something was missing? Perhaps it felt slightly bare and uninviting. I’ve got some simple tips to help you make any room feel complete.
      </p>

      <footer class="article-footer">
        <img class="image-avatar" src="./images/avatar-michelle.jpg" alt="Avater Michelle">

        <div class="user-info">
          <h2 class="text-preset-2-bold text-grey-900">Michelle Appleton</h2>
          <time datetime="2020-06-28" class="text-preset-2-medium text-grey-400">28 Jun 2020</time>
        </div>

        <button class="share-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="13"><path d="M15 6.495L8.766.014V3.88H7.441C3.33 3.88 0 7.039 0 10.936v2.049l.589-.612C2.59 10.294 5.422 9.11 8.39 9.11h.375v3.867L15 6.495z"/></svg>
        </button>
      </footer>
    </section>
  </article>

</body>
</html>
